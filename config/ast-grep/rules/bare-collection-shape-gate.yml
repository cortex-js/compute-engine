id: bare-collection-shape-gate
language: TypeScript
severity: warning
message: A bare collection type admits values only; a shape test needs the `<any>` form or a shape helper.
note: |
  The bare names `list`, `set`, `dictionary`, `collection`,
  `indexed_collection`, `tuple` and `record` mean the values-only form: their
  elements are values, and absence markers are excluded. So `list<any>`,
  `list<nothing>` and `list<integer|missing>` do NOT match bare `list`, and
  `tuple<integer, missing>` does NOT match bare `tuple`.

  To ask "is this operand collection-shaped", test
  `matches('collection<any>')` or a `*_SHAPE_TYPE` constant from
  `common/type/primitive.ts`. `tuple` and `record` have no `<any>` spelling:
  use `isTupleShapedType(t)` or `isRecordShapedType(t)` from
  `collection-utils.ts`.

  If the test is meant to accept values only, write the `<unknown>` form
  explicitly, or put `// ast-grep-ignore: bare-collection-shape-gate` on the
  line before it with a sentence that says why.
rule:
  any:
    - pattern: $X.matches($T)
    - pattern: $X?.matches($T)
    - pattern: isSubtype($A, $T)
constraints:
  T:
    regex: ^['"`](list|set|dictionary|collection|indexed_collection|tuple|record)['"`]$
